<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BlockConnect - Login</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <div class="container mt-5">
    <header class="text-center mb-4">
      <h1>🧱 BlockConnect</h1>
      <p>Welcome back! Please log in or register to create an account.</p>
    </header>

    <!-- Login Form -->
    <section id="login-form" class="text-center mb-4">
      <h3>Login</h3>
      <div>
        <label for="login-username" class="form-label">Username</label>
        <input type="text" id="login-username" class="form-control mb-3" placeholder="Enter your username" />
      </div>
      <div>
        <label for="login-password" class="form-label">Password</label>
        <input type="password" id="login-password" class="form-control mb-3" placeholder="Enter your password" />
      </div>
      <button class="btn btn-success mb-2" onclick="loginUser()">Login</button>
    </section>

    <!-- Register Form -->
    <section id="register-form" class="text-center mb-4" style="display:none;">
      <h3>Register</h3>
      <div>
        <label for="register-username" class="form-label">Username</label>
        <input type="text" id="register-username" class="form-control mb-3" placeholder="Choose a username" />
      </div>
      <div>
        <label for="register-password" class="form-label">Password</label>
        <input type="password" id="register-password" class="form-control mb-3" placeholder="Choose a password" />
      </div>
      <button class="btn btn-primary mb-2" onclick="registerUser()">Register</button>
      <div class="mt-3">
        <span>Already have an account? <a href="javascript:void(0)" onclick="toggleForms()">Login</a></span>
      </div>
    </section>

    <div class="mt-3">
      <span>Don't have an account? <a href="javascript:void(0)" onclick="toggleForms()">Register</a></span>
    </div>
  </div>

  <!-- Bootstrap JS and Popper -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.min.js"></script>

  <script>
    // Toggle between login and register forms
    function toggleForms() {
      const loginForm = document.getElementById("login-form");
      const registerForm = document.getElementById("register-form");
      if (loginForm.style.display === "none") {
        loginForm.style.display = "block";
        registerForm.style.display = "none";
      } else {
        loginForm.style.display = "none";
        registerForm.style.display = "block";
      }
    }

    async function loginUser() {
  const username = document.getElementById("login-username").value;
  const password = document.getElementById("login-password").value;
  const res = await fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password })
  });

  const data = await res.json();
  if (res.status === 200) {
    localStorage.setItem("currentUser", username); //
    alert("Login successful!");
    window.location.href = "index"; //
  } else {
    alert(data.error);
  }
}


    async function registerUser() {
      const username = document.getElementById("register-username").value;
      const password = document.getElementById("register-password").value;
      const res = await fetch("/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      alert(data.message || data.error);
      if (res.status === 200) {
        toggleForms();  // Switch to login form after successful registration
      }
    }
  </script>
</body>
</html>
